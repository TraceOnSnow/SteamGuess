name: steamguess

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  steamguess:
    image: ghcr.io/traceonsnow/steamguess:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      STEAMGUESS_DB_PATH: /app/data/runtime/steamguess.sqlite
      STEAMGUESS_TRUST_PROXY: "true"
      STEAMGUESS_WRITE_RATE_LIMIT: 60
      STEAMGUESS_REQUEST_LOG: "true"
      STEAMGUESS_ROOM_STORE: redis
      STEAMGUESS_REDIS_URL: redis://redis:6379
      STEAMGUESS_REDIS_PREFIX: steamguess:multiplayer
    networks:
      default:
      web:
        aliases: [steamguess-app]
    volumes:
      - steamguess-data:/app/data

networks:
  web:
    # Docker network of the existing Nginx container that terminates HTTPS.
    external: true
    name: homepage-web_default

volumes:
  steamguess-data:
    name: steamguess_steamguess-data
