services:
  steamguess:
    build:
      context: .
      args:
        VITE_LABELER_ENABLED: "false"
        VITE_BACKEND_ENABLED: "true"
    restart: unless-stopped
    ports:
      - "4173:4173"
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:-}
      STEAMGUESS_DB_PATH: /app/data/runtime/steamguess.sqlite
      STEAMGUESS_TRUST_PROXY: ${STEAMGUESS_TRUST_PROXY:-false}
      STEAMGUESS_WRITE_RATE_LIMIT: 60
      STEAMGUESS_PROFILE_RATE_LIMIT: 12
      STEAMGUESS_REQUEST_LOG: "true"
    volumes:
      - steamguess-data:/app/data

volumes:
  steamguess-data:
